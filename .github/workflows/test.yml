name: Test reporting collection

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - ansible: '==2.16.0'
            openpyxl: '==3.1.0'
          - ansible: '>=2.16,<3'
            openpyxl: '>=3.1,<4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: >-
          python -m pip install -r requirements-dev.txt
          'ansible-core${{ matrix.ansible }}' 'openpyxl${{ matrix.openpyxl }}'
      - name: Check code
        run: |
          ruff check .
          ruff format --check .
      - name: Test rendering and module behavior
        run: pytest -q
      - name: Build and install the collection
        run: |
          ansible-galaxy collection build --output-path /tmp --force
          ansible-galaxy collection install /tmp/ansible_tools-reporting-0.1.0.tar.gz --collections-path .test-collections --force
      - name: Check documentation and real module execution
        env:
          ANSIBLE_COLLECTIONS_PATH: '${{ github.workspace }}/.test-collections'
        run: |
          ansible-doc --json ansible_tools.reporting.xlsx_report > /dev/null
          ansible-playbook -i localhost, tests/integration/report.yml
